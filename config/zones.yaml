# Zone and spatial analysis configuration.
# Polygon points are image pixel coordinates in the original frame: [x, y].

zones:
  # Example static danger zone for the sample video. Adjust after visual calibration.
  - zone_id: sample-conveyor-danger
    camera_id: factory-floor-demo
    zone_type: conveyor_danger
    polygon:
      - [120, 400]
      - [720, 400]
      - [760, 680]
      - [100, 680]

robot_arm:
  # Initial robot-arm safety zone is generated by expanding the detected bbox.
  bbox_margin_px: 40
  smoothing_frames: 5

forklift:
  # Pixel units are temporary until homography/calibration is available.
  static_buffer_px: 120
  dynamic_lookahead_seconds: 1.5
  dynamic_buffer_px: 160

worker:
  # Worker position should use bbox bottom-center by default.
  dwell_time_seconds: 1.0

# 시스템 전체 실행 설정.

system:
  log_level: INFO

storage:
  database_path: data/events.db
  snapshot_dir: data/snapshots
  clip_dir: data/clips

tracking:
  tracker_type: bytetrack
  track_threshold: 0.5
  low_track_threshold: 0.1
  new_track_threshold: 0.5
  match_threshold: 0.7
  track_buffer: 60
  fuse_score: true
  history_seconds: 5
  max_lost_frames: 30

risk:
  # 같은 위험 상황이 반복 저장되지 않도록 cooldown을 둔다.
  event_cooldown_seconds: 5
  warning_distance_px: 150
  critical_distance_px: 80

performance:
  target_fps: 10
  frame_skip: 1
  report_p95_latency: true

# PPE 미착용 경고: 연속 누락이 지속될 때 WARNING, 착용 재탐지 시 누적 해제.
ppe_risk:
  required_classes: [helmet, gloves, safety_vest]
  missing_seconds: 1.0
  max_observation_gap_seconds: 2.0

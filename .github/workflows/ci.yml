name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests and generate reports
        run: |
          mkdir -p reports

          pytest \
            --html=reports/test-report.html \
            --self-contained-html \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html:reports/coverage

      - name: Create report index
        run: |
          cat > reports/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8">
            <title>Safe Edge Project CI Report</title>
          </head>
          <body>
            <h1>Safe Edge Project CI Report</h1>
            <ul>
              <li><a href="test-report.html">Pytest Test Report</a></li>
              <li><a href="coverage/index.html">Coverage Report</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload reports for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

  deploy-pages:
    needs: test

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4